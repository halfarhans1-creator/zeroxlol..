<script>
/* zerox.gg settings. api "" = same host (api/ folder next to this file). Page on another host: api:"https://your-domain.com".
   Site in a sub-folder / GitHub project site: base:"/folder/" */
window.GLITCH={api:"",base:"auto",__loaded:true};
</script>
<script>
/* Works on Netlify (default), GitHub Pages (user site or project site) and custom domains.
   GLITCH.api  = origin of the Netlify backend ("" = same site)
   GLITCH.base = folder the site is served from; leave "auto" to detect it (needed for project sites: user.github.io/repo/) */
(function(){var c=window.GLITCH||{},b=c.base,h=location.hostname,gh=/\.github\.io$/i.test(h);
 if(!b||b==="auto"){b="/";
  if(gh){var cs=document.querySelector('script[src$="config.js"]');
   try{if(cs&&c.__loaded)b=new URL(".",cs.src).pathname}catch(e){}
   if(b==="/"&&!c.__loaded){var seg=location.pathname.split("/")[1];if(seg&&!/^(index|404)\.html$/.test(seg)&&seg.indexOf(".")<0&&seg.toLowerCase()!==h.split(".")[0].toLowerCase())b="/"+seg+"/"}}}
 if(b.charAt(0)!=="/")b="/"+b;if(b.slice(-1)!=="/")b+="/";
 window.GB_BASE=b;var sv="";try{sv=localStorage.getItem("zerox_api")||""}catch(e){}window.GB_API=(c.api||sv||"").replace(/\/+$/,"");
 document.write('<base href="'+b+'">');
 window.GB_connect=async function(raw){var u=(raw||"").trim();if(!u)return"Paste your backend address first.";if(!/^https?:\/\//i.test(u))u="https://"+u;
  try{u=new URL(u).origin}catch(e){return"That doesn’t look like a web address."}
  var me="";try{me=localStorage.getItem("me")||""}catch(e){}if(me.length<16)me="probe-probe-probe-probe";
  try{var r=await fetch(u+"/api/discord.php?op=me",{method:"POST",headers:{"x-me":me}});var j=await r.json();
   if(!j||typeof j!=="object"||(j.error&&j.error!=="identity"))throw 0}catch(e){return"Couldn’t reach a zerox.gg backend at that address. Check that it is the address of your zerox.gg website (with the api folder)."}
  try{localStorage.setItem("zerox_api",u)}catch(e){}try{sessionStorage.setItem("gb_hint",u)}catch(e){}location.reload();return""};
 window.GB_forget=function(){try{localStorage.removeItem("zerox_api")}catch(e){}location.reload()};
 window.GB_setupForm=function(box,onDone){var inp=document.createElement("input"),go=document.createElement("button"),msg=document.createElement("div"),row=document.createElement("div");
  inp.placeholder="https://your-domain.com";inp.setAttribute("aria-label","Backend address");inp.autocomplete="off";inp.spellcheck=false;
  inp.style.cssText="flex:1;min-width:0;height:40px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.35);color:#fff;font:14px system-ui,sans-serif;outline:0";
  go.type="button";go.textContent="Connect";go.style.cssText="height:40px;padding:0 18px;border-radius:10px;border:0;background:#fff;color:#111;font:600 14px system-ui,sans-serif;cursor:pointer";
  row.style.cssText="display:flex;gap:8px;margin-top:10px";msg.style.cssText="margin-top:8px;font-size:13px;color:#ffb4b4";
  var run=async function(){go.disabled=true;go.textContent="Checking…";msg.textContent="";var e=await window.GB_connect(inp.value);if(e){msg.textContent=e;go.disabled=false;go.textContent="Connect"}};
  go.onclick=run;inp.onkeydown=function(e){if(e.key==="Enter")run()};row.append(inp,go);box.append(row,msg);if(onDone)onDone(inp)};
 try{var hu=sessionStorage.getItem("gb_hint");if(hu&&gh){sessionStorage.removeItem("gb_hint");window.addEventListener("DOMContentLoaded",function(){var d=document.createElement("div");d.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;max-width:640px;margin:0 auto;padding:16px 18px;border-radius:16px;background:#14161d;color:#e8edf8;border:1px solid rgba(47,224,138,.5);font:14px/1.5 system-ui,sans-serif";
  d.innerHTML="<b>Connected ✔</b><br>This works in your browser now. To make login work for <b>every visitor</b>, put this line in <code>config.js</code> (replace <code>api: \"\"</code>) and push it:<br><code style=\"display:block;margin:8px 0;padding:8px 10px;border-radius:8px;background:#000;user-select:all\">api: \""+hu+"\",</code>";
  var x=document.createElement("button");x.textContent="Got it";x.style.cssText="height:34px;padding:0 16px;border-radius:9px;border:0;background:#fff;color:#111;font:600 13px system-ui,sans-serif;cursor:pointer";x.onclick=function(){d.remove()};d.append(x);document.body.appendChild(d)})}}catch(e){}
 window.GB_needsApi=function(){return gh&&!window.GB_API};
 window.GB_showSetup=function(){var o=document.getElementById("gbsetup");if(o){o.style.display="block";return}
  var d=document.createElement("div");d.id="gbsetup";d.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;max-width:640px;margin:0 auto;padding:16px 18px;border-radius:16px;background:#14161d;color:#e8edf8;border:1px solid rgba(124,192,255,.45);box-shadow:0 20px 60px -20px #000;font:14px/1.5 system-ui,sans-serif";
  var t=document.createElement("div");t.innerHTML="<b style=\"font-size:15px\">Connect your backend</b><br>GitHub Pages can’t run login, profiles or uploads. Paste your backend address (the website that has the api folder) and it is saved in this browser. No file editing needed.";
  var x=document.createElement("button");x.type="button";x.textContent="✕";x.setAttribute("aria-label","Close");x.style.cssText="position:absolute;right:10px;top:8px;border:0;background:none;color:#9aa5bd;font-size:16px;cursor:pointer";x.onclick=function(){d.style.display="none"};
  d.append(t,x);window.GB_setupForm(d);document.body.appendChild(d)};
})();
</script>

<style>

<script>
/* Shared storage for Netlify: provides the same db/user/assets API the page expects, backed by /api/db.php */
(function(){
 if(window.claude)return;
 const EP=(window.GB_API||(window.GB_BASE||'/').replace(/\/$/,''))+'/api/db.php';
 const rid=()=>crypto.randomUUID?crypto.randomUUID():[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');
 let me;try{me=localStorage.getItem('me');if(!me){me=rid();localStorage.setItem('me',me)}}catch(e){me=rid()}
 window.__me=me;
 const adm=()=>{try{return localStorage.getItem('gb_admin')||''}catch(e){return''}};
 const hd=x=>({'x-me':me,'x-admin':adm(),...x});
 const call=async b=>{const r=await fetch(EP,{method:'POST',headers:hd({'content-type':'application/json'}),body:JSON.stringify(b)});
  if(!r.ok){const e=new Error('http '+r.status);e.status=r.status;try{e.code=(await r.json()).error}catch(x){}throw e}return r.json()};
 const S=new Set();let busy=0,again=0,tm=0;
 const poll=async()=>{if(!S.size)return;if(busy){again=1;return}busy=1;
  try{const cs={};S.forEach(s=>cs[s.c]=Math.max(cs[s.c]||0,s.n));
   const r=await call({op:'multi',cols:Object.keys(cs).map(c=>({c,limit:cs[c]}))});
   S.forEach(s=>{const docs=r.cols[s.c]||[],str=JSON.stringify(docs);if(str!==s.last){s.last=str;s.cb({docs:docs.map(d=>({id:d.id,data:()=>d.data}))})}})}
  catch(e){S.forEach(s=>{if(!s.f){s.f=1;if(s.err)s.err(e)}})}
  busy=0;if(again){again=0;kick()}};
 const kick=()=>{clearTimeout(tm);tm=setTimeout(poll,40)},refresh=kick;
 setInterval(()=>{if(!document.hidden)poll()},10000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
 const col=c=>({
  limit(n){return{onSnapshot(cb,err){const s={c,n,cb,err,last:'',f:0};S.add(s);kick();return()=>S.delete(s)}}},
  doc(id){return{
   async get(){const r=await call({op:'get',c,id});return{exists:r.exists,data:()=>r.data}},
   async set(data){await call({op:'set',c,id,data});refresh()},
   async delete(){await call({op:'delete',c,id});refresh()}}}});
 const db={collection:col},user={id:async()=>me,canEdit:async()=>{if(!adm())return false;try{const r=await call({op:'whoami'});return !!r.admin}catch(e){return false}}},
  assets={async upload(b){if(window.GB_needsApi&&GB_needsApi()){const e=new Error('upload no-backend');e.status=0;throw e}if(b.size>1024*1024){const CK=1024*1024,n=Math.ceil(b.size/CK),cid=rid();if(n>342){const e=new Error('upload 413');e.status=413;throw e}
   let r;for(let i=0;i<n;i++){try{toast('Uploading… '+Math.round(i/n*100)+'%')}catch(x){}let done=0,last=0,code;for(let t=0;t<3&&!done;t++){try{r=await fetch(EP+'?op=chunk&id='+cid+'&i='+i+'&n='+n+'&s='+b.size,{method:'POST',headers:hd({'content-type':b.type||'application/octet-stream'}),body:b.slice(i*CK,(i+1)*CK)});if(r.ok)done=1;else{last=r.status;try{code=(await r.clone().json()).error}catch(x){}if(r.status<500)break;await new Promise(z=>setTimeout(z,700*(t+1)))}}catch(e){last=0;await new Promise(z=>setTimeout(z,700*(t+1)))}}
    if(!done){const e=new Error('upload '+last);e.status=last;e.code=code;throw e}}
   return r.json()}
   const r=await fetch(EP+'?op=upload',{method:'POST',headers:hd({'content-type':b.type||'application/octet-stream'}),body:b});
   if(!r.ok){const e=new Error('upload '+r.status);e.status=r.status;try{e.code=(await r.json()).error}catch(x){}throw e}return r.json()}};
 window.__gbPoll=kick;
 window.claude={use:async n=>n==='db'?db:n==='user'?user:n==='assets'?assets:null};
})();
